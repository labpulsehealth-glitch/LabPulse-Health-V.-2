<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LabPulse Admin</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <!-- =========================
         ADMIN LOGIN
    ========================== -->

    <div id="adminLoginPage" class="admin-page">

        <div class="admin-login-card">

            <div class="admin-logo">
                🧪
            </div>

            <h1>LabPulse Admin</h1>

            <p class="admin-subtitle">
                Secure administration portal
            </p>

            <form id="adminLoginForm">

                <label for="adminEmail">
                    Admin Email
                </label>

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Enter admin email"
                    required
                >

                <label for="adminPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter password"
                    required
                >

                <button type="submit">
                    Sign In
                </button>

            </form>

            <p id="adminAuthMessage"></p>

        </div>

    </div>


    <!-- =========================
         ADMIN DASHBOARD
    ========================== -->

    <div id="adminDashboard" class="admin-dashboard">

        <header class="admin-header">

            <div>
                <h1>LabPulse Admin</h1>
                <p>Administration Dashboard</p>
            </div>

            <button id="adminLogout">
                Logout
            </button>

        </header>


        <main class="admin-container">

            <!-- Overview -->

            <section class="admin-overview">

                <div class="admin-stat-card">

                    <span>🧪</span>

                    <h3>Total Laboratories</h3>

                    <h2 id="totalLabs">
                        0
                    </h2>

                </div>


                <div class="admin-stat-card pending-stat">

                    <span>⏳</span>

                    <h3>Pending</h3>

                    <h2 id="pendingLabs">
                        0
                    </h2>

                </div>


                <div class="admin-stat-card approved-stat">

                    <span>✅</span>

                    <h3>Approved</h3>

                    <h2 id="approvedLabs">
                        0
                    </h2>

                </div>


                <div class="admin-stat-card rejected-stat">

                    <span>❌</span>

                    <h3>Rejected</h3>

                    <h2 id="rejectedLabs">
                        0
                    </h2>

                </div>

            </section>


            <!-- Laboratory Management -->

            <section class="admin-section">

                <div class="section-heading">

                    <div>
                        <h2>Laboratory Applications</h2>

                        <p>
                            Review and manage laboratory registrations.
                        </p>
                    </div>

                    <button
                        id="refreshLabs"
                        class="refresh-button">
                        🔄 Refresh
                    </button>

                </div>


                <div id="laboratoryList">

                    <div class="loading">
                        Loading laboratories...
                    </div>

                </div>

            </section>

        </main>

    </div>


    <!-- Laboratory Details Modal -->

    <div
        id="labModal"
        class="modal-overlay"
        style="display:none;"
    >

        <div class="lab-modal">

            <button
                id="closeLabModal"
                class="close-modal">
                ×
            </button>

            <h2 id="modalLabName">
                Laboratory
            </h2>

            <div id="modalLabDetails"></div>

            <div class="modal-actions">

                <button
                    id="approveLabButton"
                    class="approve-button">
                    ✅ Approve Laboratory
                </button>

                <button
                    id="rejectLabButton"
                    class="reject-button">
                    ❌ Reject Laboratory
                </button>

            </div>

        </div>

    </div>


    <script type="module" src="admin.js"></script>

</body>
</html>
